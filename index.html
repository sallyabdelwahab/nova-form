
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova | Create Account</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="signup-container">
        <section class="signup-card">

            <a href="#" class="logo">NOVA</a>

            <h1>Create Your Account</h1>
            <p class="subtitle">
                Join Nova and start building what's next.
            </p>

            <form id="signup-form" novalidate>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name"
                        placeholder="Enter your full name">
                    <small class="error" id="name-error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                        placeholder="Enter your email">
                    <small class="error" id="email-error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                        placeholder="Enter your phone number">
                    <small class="error" id="phone-error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                        placeholder="Create a password">
                    <small class="error" id="password-error"></small>
                </div>

                <button type="submit">Create Account</button>

                <p id="success-message" role="status"></p>

            </form>

            <p class="login-text">
                Already have an account? <a href="#">Log in</a>
            </p>

        </section>
    </main>

</body>
</html>
